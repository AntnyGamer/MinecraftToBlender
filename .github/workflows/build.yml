name: Test_and_build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  metadata_tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go test ./... -count=1

  windows_build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Run_tests
        run: go test ./... -count=1
      - name: Validate_PowerShell
        shell: powershell
        run: |
          $tokens = $null
          $parseErrors = $null
          [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path 'assets/Export_World.ps1'), [ref]$tokens, [ref]$parseErrors) | Out-Null
          if ($parseErrors.Count -gt 0) { $parseErrors | ForEach-Object { Write-Error $_ }; exit 1 }
          # Prove that direct launch preserves a literal percent sign in the
          # working directory and that PowerShell reads the child's exit code.
          $dir = Join-Path $env:RUNNER_TEMP 'MinecraftToBlender_%literal%'
          New-Item -ItemType Directory -Force -Path $dir | Out-Null
          $proc = Start-Process -FilePath (Join-Path $PSHOME 'powershell.exe') -ArgumentList '-NoProfile -Command "exit 7"' -WorkingDirectory $dir -PassThru -NoNewWindow -RedirectStandardOutput (Join-Path $dir 'stdout.log') -RedirectStandardError (Join-Path $dir 'stderr.log')
          $proc.WaitForExit()
          if ($proc.ExitCode -ne 7) { throw "Direct process exit code incorrect: $($proc.ExitCode)" }
      - name: Build_executable
        run: go build -ldflags="-H=windowsgui -s -w" -o MinecraftToBlender_v1.exe .
      - uses: actions/upload-artifact@v4
        with:
          name: MinecraftToBlender_v1_Windows
          path: MinecraftToBlender_v1.exe
          if-no-files-found: error

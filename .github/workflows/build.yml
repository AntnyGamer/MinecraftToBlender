name: Test_and_build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Pin a supported release compiler without raising the go.mod minimum.
env:
  BUILD_GO_VERSION: '1.27.3'

# The same branch is built on both push and pull_request. Cancel superseded
# builds instead of queueing duplicate Windows jobs on every review fix.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  metadata_tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.BUILD_GO_VERSION }}
          cache: false
      - name: Vet_Go
        run: go vet ./...
      - run: go test ./... -count=1
      - name: Validate_Bedrock_resources
        run: python tools/verify_bedrock_assets.py
      - name: Validate_Blender_scene_performance
        run: python tools/test_blender_scene_performance.py
      - name: Validate_MiEx_material_node_layout_optimization
        run: python tools/test_miex_layout_lookup.py
      - name: Validate_bulk_import_selection_optimization
        run: python tools/test_import_selection.py
      - name: Validate_existing_Blender_project_optimization
        run: python tools/test_existing_blend_optimizer.py
      - name: Validate_opt_in_fast_Blender_viewport
        run: python tools/test_fast_viewport.py
      - name: Validate_redundant_USD_normal_compaction
        run: python tools/test_redundant_normals.py
      - name: Validate_unused_USD_preview_colors
        run: python tools/test_unused_display_colors.py
      - name: Validate_opt_in_Minecraft_water
        run: python tools/test_minecraft_water.py
      - name: Validate_opt_in_Minecraft_texture_preview
        run: python tools/test_minecraft_texture_preview.py
      - name: Validate_Blender_static_bounds_fastpath
        run: python tools/test_blender_bounds_fastpath.py
      - name: Validate_Blender_texture_audit
        run: python tools/test_blender_texture_audit.py
      - name: Validate_MiEx_shader_lookup
        run: python tools/test_miex_material_lookup.py
      - name: Validate_complete_pinned_MiEx_importer_patch
        run: python tools/test_pinned_miex_importer.py

  windows_build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.BUILD_GO_VERSION }}
          cache: false
      - name: Run_tests
        run: go test ./... -count=1 -timeout 3m
      - name: Validate_Bedrock_state_model_installation
        shell: powershell
        run: ./tools/test_bedrock_state_corrections.ps1
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '21'
      - name: Validate_pinned_MiEx_expression_parser
        shell: pwsh
        run: |
          $jar = Join-Path $env:RUNNER_TEMP 'MiEx_parser_test.jar'
          Invoke-WebRequest -Uri 'https://github.com/BramStoutProductions/MiEx/releases/download/v2.0.0.experimental-34/MiEx.jar' -OutFile $jar -TimeoutSec 180
          $sha = (Get-FileHash -LiteralPath $jar -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($sha -ne 'e4951d44116fd2d90c14f52643b7cd66ddd7f64ac108b8a16705b379672de707') {
            throw "Pinned MiEx.jar SHA-256 mismatch: $sha"
          }
          $rebuilt = Join-Path $env:RUNNER_TEMP 'Bedrock_ChunkReader.class'
          python tools/build_bedrock_reader_patch.py --jar $jar --output $rebuilt
          if ($LASTEXITCODE -ne 0) { throw 'Could not rebuild pinned Bedrock reader' }
          if ((Get-FileHash $rebuilt).Hash -ne (Get-FileHash assets/Bedrock_ChunkReader.class).Hash) {
            throw 'Bundled Bedrock reader differs from reproducible source patch'
          }
          . ./assets/Bedrock_Assets.ps1
          $readerRoot = Install-BedrockReaderClass $jar (Resolve-Path assets/Bedrock_ChunkReader.class)
          javac -cp $jar -d $env:RUNNER_TEMP tools/MiExBedrockRegression.java
          if ($LASTEXITCODE -ne 0) { throw 'Could not compile Bedrock semantic regression' }
          $copperGeometry = Join-Path $env:RUNNER_TEMP 'copper_golem.geo.json'
          python -c "import sys,urllib.request; from tools.build_bedrock_detail_models import verified,COPPER_GEOMETRY_URL,COPPER_GEOMETRY_SHA256; open(sys.argv[1],'wb').write(verified(urllib.request.urlopen(COPPER_GEOMETRY_URL,timeout=45).read(),COPPER_GEOMETRY_SHA256))" $copperGeometry
          if ($LASTEXITCODE -ne 0) { throw 'Could not verify copper statue geometry reference' }
          java "-Dmiex.copperGeometry=$copperGeometry" -cp "$readerRoot;$jar;$env:RUNNER_TEMP" MiExBedrockRegression
          if ($LASTEXITCODE -ne 0) { throw 'Bedrock model runtime regression failed' }
          javac -cp $jar -d $env:RUNNER_TEMP tools/MiExExpressionSmoke.java
          if ($LASTEXITCODE -ne 0) { throw 'Could not compile MiEx parser regression test' }
          $exprs = [Collections.Generic.List[string]]::new()
          foreach ($file in @('Bedrock_Beds.json','Bedrock_Shulkers.json','Bedrock_Signs.json','Bedrock_Hanging_Signs.json','Bedrock_Legacy_Banners.json')) {
            $model = Get-Content -LiteralPath (Join-Path 'assets' $file) -Raw | ConvertFrom-Json
            foreach ($handler in @($model.handler)) {
              foreach ($expr in @($handler.variables)) {
                if ($null -ne $expr -and "$expr".Trim()) { $exprs.Add([string]$expr) }
              }
            }
          }
          if ($exprs.Count -lt 30) { throw 'Missing expected Bedrock expression coverage' }
          $exprs | & java -cp "$jar;$env:RUNNER_TEMP" MiExExpressionSmoke
          if ($LASTEXITCODE -ne 0) { throw 'MiEx rejected a Bedrock expression: see Java exception above' }
      - name: Reproduce_Bedrock_detail_models
        shell: pwsh
        run: |
          $rebuilt = Join-Path $env:RUNNER_TEMP 'bedrock_detail_models'
          python tools/build_bedrock_detail_models.py --output $rebuilt
          if ($LASTEXITCODE -ne 0) { throw 'Could not reproduce detail models' }
          $models = @(Get-ChildItem -LiteralPath $rebuilt -Filter '*.json' -File)
          if ($models.Count -ne 11) { throw 'Missing detail model output' }
          foreach ($model in $models) {
            if ((Get-FileHash $model.FullName).Hash -ne (Get-FileHash (Join-Path 'assets' $model.Name)).Hash) {
              throw ('Detail model source mismatch: ' + $model.Name)
            }
          }
      - name: Validate_PowerShell
        shell: powershell
        run: |
          & ./tools/test_miex_launch_args.ps1
          & ./tools/test_preview_batches.ps1
          $tokens = $null
          $parseErrors = $null
          $ast = [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path 'assets/Export_World.ps1'), [ref]$tokens, [ref]$parseErrors)
          if ($parseErrors.Count -gt 0) { $parseErrors | ForEach-Object { Write-Error $_ }; exit 1 }
          $bedrockErrors = $null
          $bedrockTokens = $null
          [void][System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path 'assets/Bedrock_Assets.ps1'), [ref]$bedrockTokens, [ref]$bedrockErrors)
          if ($bedrockErrors.Count -gt 0) { $bedrockErrors | ForEach-Object { Write-Error $_ }; exit 1 }
          . (Resolve-Path 'assets/Bedrock_Assets.ps1')
          $sample = Join-Path $env:RUNNER_TEMP 'verified_git_blob_sample.txt'
          [IO.File]::WriteAllBytes($sample, [Text.Encoding]::UTF8.GetBytes("hello world`n"))
          if (-not (Test-GitBlobSha1 $sample '3b18e512dba79e4c8300dd08aeb37f8e728b8dad')) {
            throw 'Git blob SHA1 verifier incorrectly rejected known bytes'
          }
          if (Test-GitBlobSha1 $sample ('0' * 40)) { throw 'Git blob verifier accepted a mismatched hash' }
          # Streaming verification must keep the exact Git hash across several
          # 64 KiB read boundaries, not just for the tiny texture fixture.
          $largeSample = Join-Path $env:RUNNER_TEMP 'verified_git_blob_large.bin'
          $largeBytes = New-Object byte[] 200003
          for($i = 0; $i -lt $largeBytes.Length; $i++) { $largeBytes[$i] = [byte]($i % 251) }
          [IO.File]::WriteAllBytes($largeSample, $largeBytes)
          $header = [Text.Encoding]::ASCII.GetBytes(('blob ' + $largeBytes.Length + [char]0))
          $expectedPayload = New-Object byte[] ($header.Length + $largeBytes.Length)
          [Array]::Copy($header, 0, $expectedPayload, 0, $header.Length)
          [Array]::Copy($largeBytes, 0, $expectedPayload, $header.Length, $largeBytes.Length)
          $sha1 = [Security.Cryptography.SHA1]::Create()
          try {
            $expectedLarge = ([BitConverter]::ToString($sha1.ComputeHash($expectedPayload))).Replace('-', '').ToLowerInvariant()
          } finally { $sha1.Dispose() }
          if (-not (Test-GitBlobSha1 $largeSample $expectedLarge)) {
            throw 'Streaming Git blob verification differs from the original full-buffer hash'
          }
          $testBedDir = Join-Path $env:RUNNER_TEMP 'asset_cleanup/resources/BlenderEEVEE/assets/minecraft/textures/entity/bed'
          New-Item -ItemType Directory -Force -Path $testBedDir | Out-Null
          $testBedFile = Join-Path $testBedDir 'red.png'
          $testManifest = Join-Path $env:RUNNER_TEMP 'asset_cleanup_manifest.json'
          @{ textures = @(@{ to = 'red.png'; git_blob_sha1 = '3b18e512dba79e4c8300dd08aeb37f8e728b8dad' }) } |
            ConvertTo-Json -Depth 5 | Set-Content -LiteralPath $testManifest -Encoding UTF8
          [IO.File]::WriteAllBytes($testBedFile, [Text.Encoding]::UTF8.GetBytes("hello world`n"))
          Remove-ManagedBedrockBedTextures (Join-Path $env:RUNNER_TEMP 'asset_cleanup') $testManifest
          if (Test-Path -LiteralPath $testBedFile) { throw 'Managed Bedrock fallback texture was not cleaned up' }
          [IO.File]::WriteAllText($testBedFile, 'user custom texture')
          Remove-ManagedBedrockBedTextures (Join-Path $env:RUNNER_TEMP 'asset_cleanup') $testManifest
          if (-not (Test-Path -LiteralPath $testBedFile)) { throw 'Cleanup deleted a user-created texture' }
          # Existing custom textures must survive a later Bedrock export.
          # Mock the downloader to verify both the no-overwrite path and the
          # original download behavior, without any network dependency.
          $installDir = Join-Path $env:RUNNER_TEMP 'asset_install'
          $bedNames = @('white','orange','magenta','light_blue','yellow','lime','pink','gray','light_gray','cyan','purple','blue','brown','green','red','black')
          # Test with real PNG data rather than the old "hello world" mock,
          # which previously passed while producing a black bed in Blender.
          Add-Type -AssemblyName System.Drawing
          $vanillaSample = Join-Path $env:RUNNER_TEMP 'bedrock_vanilla_sample.png'
          $customSample = Join-Path $env:RUNNER_TEMP 'bedrock_user_sample.png'
          $image = [Drawing.Bitmap]::new(64,64)
          try {
            $image.SetPixel(4,4,[Drawing.Color]::Red)
            $image.Save($vanillaSample,[Drawing.Imaging.ImageFormat]::Png)
          } finally { $image.Dispose() }
          $image = [Drawing.Bitmap]::new(64,64)
          try {
            $image.SetPixel(4,4,[Drawing.Color]::Blue)
            $image.Save($customSample,[Drawing.Imaging.ImageFormat]::Png)
          } finally { $image.Dispose() }
          if(-not (Test-BedrockBedAtlas $vanillaSample) -or
             -not (Test-BedrockBedAtlas $customSample) -or
             (Test-BedrockBedAtlas $sample)) {
            throw '64x64 Bedrock PNG validation rejected a valid atlas or accepted invalid bytes'
          }
          $script:sourceBedBytes = [IO.File]::ReadAllBytes($vanillaSample)
          $prefix = [Text.Encoding]::ASCII.GetBytes(('blob ' + $script:sourceBedBytes.Length + [char]0))
          $payload = New-Object byte[] ($prefix.Length + $script:sourceBedBytes.Length)
          [Array]::Copy($prefix,0,$payload,0,$prefix.Length)
          [Array]::Copy($script:sourceBedBytes,0,$payload,$prefix.Length,$script:sourceBedBytes.Length)
          $sha1 = [Security.Cryptography.SHA1]::Create()
          try {
            $expectedBedBlob = ([BitConverter]::ToString($sha1.ComputeHash($payload))).Replace('-','').ToLowerInvariant()
          } finally { $sha1.Dispose() }
          $installManifest = Join-Path $env:RUNNER_TEMP 'asset_install_manifest.json'
          @{ source='Mojang/bedrock-samples'; revision=('a' * 40); folder='resource_pack/textures/entity/bed';
             textures=@($bedNames | ForEach-Object { @{from=($_ + '.png');to=($_ + '.png');git_blob_sha1=$expectedBedBlob} }) } |
            ConvertTo-Json -Depth 7 | Set-Content -LiteralPath $installManifest -Encoding UTF8
          $installBedDir = Join-Path $installDir 'resources/BlenderEEVEE/assets/minecraft/textures/entity/bed'
          New-Item -ItemType Directory -Force -Path $installBedDir | Out-Null
          foreach ($name in $bedNames) { [IO.File]::Copy($customSample,(Join-Path $installBedDir ($name + '.png'))) }
          $script:assetDownloads = 0
          function Invoke-WebRequest {
            [CmdletBinding()]
            param([switch]$UseBasicParsing,[string]$Uri,[string]$OutFile,[int]$TimeoutSec)
            $script:assetDownloads++
            [IO.File]::WriteAllBytes($OutFile, $script:sourceBedBytes)
          }
          Ensure-BedrockBedTextures $installDir $installManifest
          if ($script:assetDownloads -ne 0) { throw 'Installer downloaded over a valid custom texture' }
          foreach ($name in $bedNames) {
            $path = Join-Path $installBedDir ($name + '.png')
            if (-not (Test-GitBlobSha1 $path $expectedBedBlob) -and
                (Test-BedrockBedAtlas $path) -and
                ([Convert]::ToBase64String([IO.File]::ReadAllBytes($path)) -eq
                 [Convert]::ToBase64String([IO.File]::ReadAllBytes($customSample)))) {
              continue
            }
            throw ('Installer overwrote or corrupted user customization: ' + $name)
          }
          $missingBed = Join-Path $installBedDir 'red.png'
          Remove-Item -LiteralPath $missingBed -Force
          Ensure-BedrockBedTextures $installDir $installManifest
          if ($script:assetDownloads -ne 1 -or
              -not (Test-GitBlobSha1 $missingBed $expectedBedBlob) -or
              -not (Test-BedrockBedAtlas $missingBed)) {
            throw 'Missing managed bed PNG was not installed, decoded and verified'
          }
          $damaged = Join-Path $installBedDir 'orange.png'
          [IO.File]::WriteAllText($damaged,'corrupt PNG')
          try {
            Ensure-BedrockBedTextures $installDir $installManifest
            throw 'A corrupt Bedrock bed texture was silently accepted'
          } catch {
            if($_.Exception.Message -eq 'A corrupt Bedrock bed texture was silently accepted') { throw }
          }
          [IO.File]::Copy($customSample,$damaged,$true)
          # Bedrock shulker atlas tests reuse real 64x64 PNG mocks and their
          # verified Git blob hashes; official assets must not erase custom
          # textures or leave a partially installed pack after a download error.
          $shulkerNames = @('black','blue','brown','cyan','gray','green','light_blue',
            'lime','magenta','orange','pink','purple','red','silver','undyed','white','yellow')
          $shulkerManifest = Join-Path $env:RUNNER_TEMP 'mock_shulker_manifest.json'
          $shulkerEntries = @($shulkerNames | ForEach-Object {
            $from = 'shulker_' + $_ + '.png'
            $to = if($_ -eq 'silver') { 'shulker_light_gray.png' } elseif($_ -eq 'undyed') { 'shulker.png' } else { $from }
            @{from=$from;to=$to;git_blob_sha1=$expectedBedBlob}
          })
          @{source='Mojang/bedrock-samples'; revision=('b' * 40); folder='resource_pack/textures/entity/shulker';
            textures=$shulkerEntries} | ConvertTo-Json -Depth 7 |
            Set-Content -LiteralPath $shulkerManifest -Encoding UTF8
          $shulkerDir = Join-Path $installDir 'resources/BlenderEEVEE/assets/minecraft/textures/entity/shulker'
          New-Item -ItemType Directory -Force -Path $shulkerDir | Out-Null
          [IO.File]::Copy($customSample,(Join-Path $shulkerDir 'shulker_white.png'))
          $script:assetDownloads = 0
          Ensure-BedrockShulkerTextures $installDir $shulkerManifest
          if($script:assetDownloads -ne 16) { throw 'Wrong count of Bedrock shulker images downloaded' }
          foreach($entry in $shulkerEntries) {
            $path = Join-Path $shulkerDir $entry.to
            if(-not (Test-BedrockBedAtlas $path)) { throw ('Invalid shulker atlas: ' + $entry.to) }
            if($entry.to -eq 'shulker_white.png') {
              if(Test-GitBlobSha1 $path $expectedBedBlob) { throw 'Custom white shulker texture was overwritten' }
            } elseif(-not (Test-GitBlobSha1 $path $expectedBedBlob)) {
              throw ('Missing verified Bedrock shulker atlas: ' + $entry.to)
            }
          }
          [IO.File]::Copy($customSample,(Join-Path $shulkerDir 'shulker_red.png'),$true)
          Remove-ManagedBedrockShulkerTextures $installDir $shulkerManifest
          if(-not (Test-Path (Join-Path $shulkerDir 'shulker_white.png')) -or
             -not (Test-Path (Join-Path $shulkerDir 'shulker_red.png')) -or
             (Test-Path (Join-Path $shulkerDir 'shulker.png'))) {
            throw 'Bedrock shulker cleanup removed custom textures or retained managed vanilla files'
          }
          # A failed network request must not install only a subset of colors.
          $script:assetDownloads = 0
          function Invoke-WebRequest {
            [CmdletBinding()]
            param([switch]$UseBasicParsing,[string]$Uri,[string]$OutFile,[int]$TimeoutSec)
            $script:assetDownloads++
            if($script:assetDownloads -eq 2) { throw 'Simulated network outage' }
            [IO.File]::WriteAllBytes($OutFile, $script:sourceBedBytes)
          }
          Ensure-BedrockShulkerTextures $installDir $shulkerManifest
          if($script:assetDownloads -ne 2 -or
             (Test-Path (Join-Path $shulkerDir 'shulker.png')) -or
             (Test-Path (Join-Path $shulkerDir 'shulker_black.png')) -or
             @(Get-ChildItem -LiteralPath $shulkerDir -Filter '*.new').Count -ne 0) {
            throw 'Interrupted shulker download installed partial textures or left temporary files'
          }
          Remove-Item Function:Invoke-WebRequest
          # Exercise the actual captured-process helpers, not a separate mock.
          foreach ($name in @('Start-CapturedProcess', 'Finish-CapturedProcess', 'Get-PreviewChunkCoordinates', 'Format-MiExMemory', 'Assert-GeneratedTextureFiles', 'Publish-Export', 'Restore-InterruptedExport', 'Copy-WorldSnapshot', 'Remove-ManagedPreviewPack', 'Test-ChunkTerrainGeometry', 'Assert-ReferencedChunkLayers', 'Read-MiExDiagnostics', 'Read-MiExAuditLog', 'Test-UnsupportedBedrockChunk', 'Assert-SafeResourcePackArchives')) {
            $definitions = @($ast.FindAll({ param($node) $node -is [System.Management.Automation.Language.FunctionDefinitionAst] -and $node.Name -eq $name }, $true))
            if ($definitions.Count -ne 1) { throw "Missing process helper: $name" }
            . ([ScriptBlock]::Create($definitions[0].Extent.Text))
          }
          # Sample the real Windows PowerShell process, including its PID and
          # private/working-set terminology. Tiny launcher memory must never
          # be presented as a verified MiEx JVM working set.
          $memoryReport = Format-MiExMemory ([System.Diagnostics.Process]::GetCurrentProcess())
          if ($memoryReport -notmatch 'MiEx JVM:' -and $memoryReport -notmatch 'MiEx JVM memory: unavailable') {
            throw ('Unexpected MiEx memory telemetry: ' + $memoryReport)
          }
          if ($memoryReport -match 'Java RAM \(working set\): 10 MiB') {
            throw 'Stale launcher working set was incorrectly presented as JVM memory'
          }
          # Verify exact preview coordinates and bounded large-area sampling.
          $small = @(Get-PreviewChunkCoordinates -1 0 -1 0)
          if($small.Count -ne 4 -or
             (@($small | Where-Object { $_.chunkX -eq -1 -and $_.chunkZ -eq -1 })).Count -ne 1 -or
             (@($small | Where-Object { $_.chunkX -eq 0 -and $_.chunkZ -eq 0 })).Count -ne 1) {
            throw 'Negative chunk coordinates were dropped or reordered'
          }
          $exact = @(Get-PreviewChunkCoordinates -36 35 -36 35)
          if($exact.Count -ne 5184) { throw "A 1152-block region did not request full chunk coverage: $($exact.Count)" }
          $large = @(Get-PreviewChunkCoordinates -64 63 -64 63)
          if($large.Count -ne 9216) { throw "Large preview did not honor its sample cap: $($large.Count)" }
          if((@($large | Where-Object { $_.chunkX -eq -64 -and $_.chunkZ -eq -64 })).Count -ne 1 -or
             (@($large | Where-Object { $_.chunkX -eq 63 -and $_.chunkZ -eq 63 })).Count -ne 1) {
            throw 'Large sample grid did not include its full geographic bounds'
          }
          $generatedStage = Join-Path $env:RUNNER_TEMP 'generated_materials'
          $generatedFolder = Join-Path $generatedStage 'Sample_chunks/textures/banner'
          New-Item -ItemType Directory -Force -Path $generatedFolder | Out-Null
          $generatedRef = '{"texture":"./Sample_chunks/textures/banner/banner_abc.png"}'
          try {
            [void](Assert-GeneratedTextureFiles $generatedStage 'Sample' $generatedRef)
            throw 'Missing generated banner image passed validation'
          } catch {
            if($_.Exception.Message -eq 'Missing generated banner image passed validation') { throw }
          }
          [IO.File]::WriteAllBytes((Join-Path $generatedFolder 'banner_abc.png'), [byte[]](1,2,3))
          if((Assert-GeneratedTextureFiles $generatedStage 'Sample' $generatedRef) -ne 1) {
            throw 'Generated banner image was not accepted or deduplicated'
          }
          $packRoot = Join-Path $env:RUNNER_TEMP 'preview_pack_cleanup'
          $ownedName = 'MinecraftToBlender_Preview_' + ('a' * 32)
          $userName = 'UserResourcePack'
          New-Item -ItemType Directory -Force -Path (Join-Path $packRoot $ownedName), (Join-Path $packRoot $userName) | Out-Null
          try {
            Remove-ManagedPreviewPack $packRoot $userName
            throw 'Cleanup erroneously accepted a user pack'
          } catch {
            if ($_.Exception.Message -eq 'Cleanup erroneously accepted a user pack') { throw }
          }
          Remove-ManagedPreviewPack $packRoot $ownedName
          if (Test-Path -LiteralPath (Join-Path $packRoot $ownedName)) { throw 'Temporary preview pack was not cleaned up' }
          if (-not (Test-Path -LiteralPath (Join-Path $packRoot $userName))) { throw 'Preview cleanup modified an unrelated resource pack' }
          $dir = Join-Path $env:RUNNER_TEMP 'MinecraftToBlender_%literal%'
          New-Item -ItemType Directory -Force -Path $dir | Out-Null
          $capture = Start-CapturedProcess (Join-Path $PSHOME 'powershell.exe') '-NoProfile -Command "exit 7"' $dir (Join-Path $dir 'stdout.log') (Join-Path $dir 'stderr.log')
          $exitCode = Finish-CapturedProcess $capture
          if ($exitCode -ne 7) { throw "Direct process exit code incorrect: $exitCode" }
          # A real MiEx world response can contain huge player NBT (including
          # keys differing only by case). Parse its path without loading NBT.
          $diagnosticLog = Join-Path $dir 'diagnostic.log'
          $diagnosticErr = Join-Path $dir 'diagnostic.err'
          $worldResponse = '[COMMAND] {"status":"success","world":{"path":"C:\\MiEx\\world_source","players":[{"Name":"a","name":"b","data":"' + ('x' * 20000) + '"}]}}'
          $chunkResponse = '[COMMAND] {"status":"success","chunks":[{"chunkX":-1,"layerCount":2,"heightmap":"AAAA"},{"chunkX":0,"layerCount":0},{"chunkX":1,"layerCount":1}]}'
          [IO.File]::WriteAllLines($diagnosticLog, [string[]]@($worldResponse, $chunkResponse))
          [IO.File]::WriteAllText($diagnosticErr, '')
          $diagnostics = Read-MiExDiagnostics $diagnosticLog
          if ($diagnostics.WorldPath -ne 'C:\MiEx\world_source' -or -not $diagnostics.Reported -or
              $diagnostics.Returned -ne 3 -or $diagnostics.Readable -ne 2) {
            throw ('MiEx diagnostic parsing failed: ' + ($diagnostics | Out-String))
          }

          # The final accuracy report must preserve the same log classifications
          # while reading an enormous MiEx log only once.
          $auditLog = Join-Path $dir 'audit_cases.log'
          $auditLines = [System.Collections.Generic.List[string]]::new()
          $auditLines.Add('[COMMAND] {"status":"success"}')
          # Setup success alone must not count as export success.
          $auditLines.Add('Exporting world to C:\MiEx\test.usd')
          $auditLines.Add('[COMMAND] {"status":"success"}')
          $auditLines.Add('Missing blockstate: minecraft:bed')
          $auditLines.Add('Missing blockstate: minecraft:bed')
          $auditLines.Add('Missing blockstate: minecraft:banner')
          $auditLines.Add('Before: No model file found')
          $auditLines.Add('  [MSG] Error: invalid texture   ')
          for ($i=0; $i -lt 40; $i++) { $auditLines.Add(('Missing texture sample {0}' -f $i)) }
          [IO.File]::WriteAllLines($auditLog, $auditLines)
          $accuracy = Read-MiExAuditLog $auditLog
          if (-not $accuracy.Success -or @($accuracy.Missing).Count -ne 2 -or
              (@($accuracy.Missing) -notcontains 'minecraft:bed') -or
              (@($accuracy.Missing) -notcontains 'minecraft:banner') -or
              @($accuracy.Errors).Count -ne 35 -or
              $accuracy.Errors[0] -ne 'Before: No model file found' -or
              $accuracy.Errors[1] -ne '[MSG] Error: invalid texture') {
            throw ('Streaming audit changed missing-blockstate or error classifications: ' + ($accuracy | Out-String))
          }
          $setupOnly = Join-Path $dir 'setup_only.log'
          [IO.File]::WriteAllLines($setupOnly, [string[]]@('[COMMAND] {"status":"success"}', 'Exporting world to C:\MiEx\test.usd'))
          if((Read-MiExAuditLog $setupOnly).Success) { throw 'Setup success incorrectly counted as export success' }
          $emptyAccuracy = Read-MiExAuditLog (Join-Path $dir 'nonexistent_audit.log')
          if ($emptyAccuracy.Success -or @($emptyAccuracy.Missing).Count -ne 0 -or
              @($emptyAccuracy.Errors).Count -ne 0) { throw 'Missing MiEx log no longer yields empty audit' }
          if (Test-UnsupportedBedrockChunk $diagnosticLog $diagnosticErr) { throw 'Invented unsupported-chunk warning' }
          [IO.File]::WriteAllText($diagnosticErr, 'Chunk section format not supported')
          if (-not (Test-UnsupportedBedrockChunk $diagnosticLog $diagnosticErr)) { throw 'Missed unsupported chunk error' }
          # Verify empty USD layers are rejected and real chunk faces pass.
          $chunks = Join-Path $dir 'chunk_geometry'
          New-Item -ItemType Directory -Force -Path $chunks | Out-Null
          $chunkFile = Join-Path $chunks 'region_1_chunk_0_0_render.usd'
          Set-Content -LiteralPath $chunkFile -Value 'int[] faceVertexCounts = []' -Encoding ASCII
          $chunkList = @(Get-ChildItem -LiteralPath $chunks -Filter '*.usd' -File -Recurse -ErrorAction Stop)
          if (Test-ChunkTerrainGeometry $chunks) { throw 'Empty USD chunk incorrectly passed terrain check' }
          if (Test-ChunkTerrainGeometry $chunks $chunkList) { throw 'Reused USD file list incorrectly passed empty terrain' }
          Set-Content -LiteralPath $chunkFile -Value 'int[] faceVertexCounts = [4,4]' -Encoding ASCII
          if (-not (Test-ChunkTerrainGeometry $chunks)) { throw 'Valid USD chunk incorrectly failed terrain check' }
          if (-not (Test-ChunkTerrainGeometry $chunks $chunkList)) { throw 'Reused USD file list missed valid terrain' }
          # Detect missing/zero-byte files referenced by the main USD before
          # publishing it over a previously completed export.
          $noReferences = [regex]::Matches('', 'payload')
          try {
            [void](Assert-ReferencedChunkLayers $dir $noReferences)
            throw 'Zero referenced chunk layers incorrectly accepted'
          } catch {
            if($_.Exception.Message -eq 'Zero referenced chunk layers incorrectly accepted') { throw }
          }
          $referenced = Join-Path $dir 'referenced_chunk_layers'
          New-Item -ItemType Directory -Force -Path $referenced | Out-Null
          $references = [regex]::Matches('payload = @./World_chunks/region_1_chunk_1_1.usd@; payload = @./World_chunks/region_1_chunk_1_1.usd@', 'payload\s*=\s*@\./World_chunks/region_1_chunk_\d+_\d+\.usd@')
          try {
            [void](Assert-ReferencedChunkLayers $referenced $references)
            throw 'Missing referenced chunk incorrectly accepted'
          } catch {
            if($_.Exception.Message -eq 'Missing referenced chunk incorrectly accepted') { throw }
          }
          $layer = Join-Path $referenced 'region_1_chunk_1_1.usd'
          [IO.File]::WriteAllText($layer, '')
          try {
            [void](Assert-ReferencedChunkLayers $referenced $references)
            throw 'Empty referenced chunk incorrectly accepted'
          } catch {
            if($_.Exception.Message -eq 'Empty referenced chunk incorrectly accepted') { throw }
          }
          [IO.File]::WriteAllText($layer, '#usda 1.0')
          if((Assert-ReferencedChunkLayers $referenced $references) -ne 1) {
            throw 'USD chunk references were not validated/deduplicated correctly'
          }
          # A pre-enumerated list avoids a second directory walk entirely.
          $unusedPath = Join-Path $dir 'missing_chunk_folder'
          if (-not (Test-ChunkTerrainGeometry $unusedPath $chunkList)) {
            throw 'Pre-enumerated USD validation unexpectedly scanned its folder'
          }
          # World resource-pack archives must not write files outside the pack directory.
          $packWorld = Join-Path $dir 'pack_world'
          $packFolder = Join-Path $packWorld 'resource_packs'
          New-Item -ItemType Directory -Force -Path $packFolder | Out-Null
          Add-Type -AssemblyName System.IO.Compression, System.IO.Compression.FileSystem
          $safeArchive = [IO.Compression.ZipFile]::Open((Join-Path $packFolder 'safe.zip'), [IO.Compression.ZipArchiveMode]::Create)
          try { [void]$safeArchive.CreateEntry('textures/stone.png') } finally { $safeArchive.Dispose() }
          Assert-SafeResourcePackArchives $packWorld
          $badArchive = [IO.Compression.ZipFile]::Open((Join-Path $packFolder 'bad.zip'), [IO.Compression.ZipArchiveMode]::Create)
          try { [void]$badArchive.CreateEntry('../outside.png') } finally { $badArchive.Dispose() }
          $blocked = $false
          try { Assert-SafeResourcePackArchives $packWorld } catch { $blocked = $_.Exception.Message -like '*Unsafe resource-pack archive entry*' }
          if (-not $blocked) { throw 'Unsafe resource-pack ZIP entry was not rejected' }
          # Verify parallel snapshot copy preserves full world folder structure.
          $sourceWorld = Join-Path $dir 'copy_source'
          $destWorld = Join-Path $dir 'copy_dest'
          New-Item -ItemType Directory -Force -Path (Join-Path $sourceWorld 'db') | Out-Null
          Set-Content -LiteralPath (Join-Path $sourceWorld 'level.dat') -Value 'sample'
          Set-Content -LiteralPath (Join-Path $sourceWorld 'db/00001.ldb') -Value 'db data'
          Copy-WorldSnapshot $sourceWorld $destWorld
          if(-not (Test-Path -LiteralPath (Join-Path $destWorld 'level.dat')) -or
             -not (Test-Path -LiteralPath (Join-Path $destWorld 'db/00001.ldb'))) {
              throw 'Snapshot copy dropped a file'
          }
          # A hard termination can leave the old complete USD in a
          # .previous_GUID backup with no normal export directory. Recover it.
          $recovered = Join-Path $dir 'Recovered'
          $backup = $recovered + '.previous_' + ('a' * 32)
          New-Item -ItemType Directory -Force -Path $backup, (Join-Path $backup 'Recovered_chunks') | Out-Null
          Set-Content -LiteralPath (Join-Path $backup 'Recovered.usd') -Value '#usda 1.0'
          Set-Content -LiteralPath (Join-Path $backup 'Recovered_materials.json') -Value '{}'
          if (-not (Restore-InterruptedExport $recovered)) { throw 'Interrupted export backup was not recovered' }
          if (-not (Test-Path -LiteralPath (Join-Path $recovered 'Recovered.usd')) -or (Test-Path -LiteralPath $backup)) {
            throw 'Recovered export is incomplete or original backup remained in place'
          }
          $anotherBackup = $recovered + '.previous_' + ('b' * 32)
          New-Item -ItemType Directory -Force -Path $anotherBackup, (Join-Path $anotherBackup 'Recovered_chunks') | Out-Null
          Set-Content -LiteralPath (Join-Path $anotherBackup 'Recovered.usd') -Value 'should never overwrite'
          Set-Content -LiteralPath (Join-Path $anotherBackup 'Recovered_materials.json') -Value '{}'
          if (Restore-InterruptedExport $recovered) { throw 'Recovery unexpectedly replaced an existing export' }
          if ((Get-Content -LiteralPath (Join-Path $recovered 'Recovered.usd') -Raw).Trim() -ne '#usda 1.0') {
            throw 'Existing export was overwritten by a stale backup'
          }
          # Replacing generated USD must not mix stale chunk files or delete user notes.
          $original = Join-Path $dir 'World'
          $stage = Join-Path $dir '.staging_world'
          New-Item -ItemType Directory -Force -Path $original, $stage, (Join-Path $original 'World_chunks'), (Join-Path $stage 'World_chunks') | Out-Null
          Set-Content -LiteralPath (Join-Path $original 'World_chunks/old.usd') -Value 'old'
          Set-Content -LiteralPath (Join-Path $stage 'World_chunks/new.usd') -Value 'new'
          Set-Content -LiteralPath (Join-Path $stage 'World.usd') -Value 'root'
          Publish-Export $stage $original
          if (-not (Test-Path -LiteralPath (Join-Path $original 'World_chunks/new.usd')) -or
              (Test-Path -LiteralPath (Join-Path $original 'World_chunks/old.usd'))) {
            throw 'Published export mixed old and new chunk layers'
          }
          Set-Content -LiteralPath (Join-Path $original 'Saved.blend') -Value 'blender project'
          Set-Content -LiteralPath (Join-Path $original 'Saved.blend1') -Value 'blender backup'
          Set-Content -LiteralPath (Join-Path $original 'notes.txt') -Value 'user files must survive'
          $nextStage = Join-Path $dir '.next_world'
          New-Item -ItemType Directory -Force -Path $nextStage, (Join-Path $nextStage 'World_chunks') | Out-Null
          Set-Content -LiteralPath (Join-Path $nextStage 'World_chunks/newer.usd') -Value 'newer'
          Set-Content -LiteralPath (Join-Path $nextStage 'World.usd') -Value 'next root'
          Publish-Export $nextStage $original
          foreach ($name in @('Saved.blend', 'Saved.blend1', 'notes.txt', 'World.usd')) {
            if (-not (Test-Path -LiteralPath (Join-Path $original $name))) { throw "Export lost $name" }
          }
          if ((Test-Path -LiteralPath (Join-Path $original 'World_chunks/new.usd')) -or
              -not (Test-Path -LiteralPath (Join-Path $original 'World_chunks/newer.usd'))) {
            throw 'Export retained stale USD chunks after replacing the world'
          }
          # If publication fails, restore the previously published output.
          try { Publish-Export (Join-Path $dir 'missing_stage') $original; throw 'Expected promotion failure' }
          catch { if ($_.Exception.Message -eq 'Expected promotion failure') { throw } }
          foreach ($name in @('Saved.blend', 'Saved.blend1', 'notes.txt', 'World.usd')) {
            if (-not (Test-Path -LiteralPath (Join-Path $original $name))) { throw "Failed publication lost $name" }
          }
      - name: Validate_Blender_importer
        run: python -c "from pathlib import Path; p = Path('assets/Import_Existing_USD.py'); compile(p.read_bytes(), str(p), 'exec')"
      - name: Embed_application_icon
        run: |
          python tools/generate_icons.py
          go run github.com/tc-hib/go-winres@v0.3.3 make --in winres/winres.json --out rsrc --arch amd64
          if (!(Test-Path rsrc_windows_amd64.syso)) { throw 'Windows icon resource was not produced' }
      - name: Build_executable
        run: go build -ldflags="-H=windowsgui -s -w" -o MinecraftToBlender_v1.exe .
      - name: Verify_Windows_version_information
        shell: pwsh
        run: |
          $expected = (Get-Content VERSION -Raw).Trim() + '.0'
          $versionInfo = (Get-Item 'MinecraftToBlender_v1.exe').VersionInfo
          if ($versionInfo.FileVersion -ne $expected -or $versionInfo.ProductVersion -ne $expected) {
            throw "Compiled EXE version does not match VERSION ($expected): file=$($versionInfo.FileVersion), product=$($versionInfo.ProductVersion)"
          }
      - name: Verify_normal_user_application_manifest
        shell: powershell
        run: ./tools/verify_windows_manifest.ps1
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: MinecraftToBlender_v1_Windows
          path: MinecraftToBlender_v1.exe
          if-no-files-found: error

  release:
    # A release represents the tested tag, not whichever main build ran first.
    # Immutable release tags cannot be reused after deletion. Give replacement
    # Release 1.0 builds a fresh release-1.0-* tag and retain the display title.
    # Release 1.0 can also be published from a specially marked, fully tested
    # main-branch merge. The tag is created only after all required checks pass.
    # Normal pushes do not publish releases.
    if: >-
      github.event_name == 'push' &&
      (startsWith(github.ref, 'refs/tags/release-1.0-') ||
       (github.ref == 'refs/heads/main' && contains(github.event.head_commit.message, '[release-1.0]')))
    needs: [metadata_tests, windows_build]
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Publish_and_verify_Release_1_0
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ startsWith(github.ref, 'refs/tags/release-1.0-') && github.ref_name || format('release-1.0-{0}', github.run_id) }}
        run: |
          set -euo pipefail
          # GITHUB_TOKEN-created tags do not launch a duplicate workflow.
          # Rerunning this job is safe if its tag was already created.
          if [ "$GITHUB_REF" = "refs/heads/main" ]; then
            # gh api may print JSON/null on a 404. Test its exit status,
            # not command-substitution text, before deciding a tag exists.
            if gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$RELEASE_TAG" \
              --jq '.object.sha' > "$RUNNER_TEMP/release_tag_sha" 2>/dev/null; then
              existing_tag="$(cat "$RUNNER_TEMP/release_tag_sha")"
              test "$existing_tag" = "$GITHUB_SHA"
            else
              echo "Creating tested Release 1.0 tag: $RELEASE_TAG"
              gh api --method POST "repos/$GITHUB_REPOSITORY/git/refs" \
                -f ref="refs/tags/$RELEASE_TAG" -f sha="$GITHUB_SHA"
            fi
          fi
          test "$(tr -d '\r\n' < VERSION)" = '1.0.0'
          test "$(gh api "repos/$GITHUB_REPOSITORY/commits/$RELEASE_TAG" --jq '.sha')" = "$GITHUB_SHA"
          mkdir -p release verified-release
          gh run download "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY" --name MinecraftToBlender_v1_Windows --dir release
          test -s release/MinecraftToBlender_v1.exe
          (cd release && sha256sum MinecraftToBlender_v1.exe > SHA256SUMS.txt)
          # Keep uploads private until the actual downloaded bytes match this
          # run's tested executable. An interrupted draft can be retried safely.
          if ! gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release create "$RELEASE_TAG" release/MinecraftToBlender_v1.exe release/SHA256SUMS.txt \
              --draft --verify-tag --target "$GITHUB_SHA" --title "Release 1.0" \
              --notes-file .github/RELEASE_NOTES_v1.0.md
          elif [ "$(gh release view "$RELEASE_TAG" --json isDraft --jq '.isDraft')" = 'true' ]; then
            gh release upload "$RELEASE_TAG" release/MinecraftToBlender_v1.exe release/SHA256SUMS.txt --clobber
            gh release edit "$RELEASE_TAG" --title 'Release 1.0' --notes-file .github/RELEASE_NOTES_v1.0.md
          fi
          gh release download "$RELEASE_TAG" --pattern MinecraftToBlender_v1.exe --pattern SHA256SUMS.txt --dir verified-release
          cmp release/SHA256SUMS.txt verified-release/SHA256SUMS.txt
          (cd verified-release && sha256sum --check SHA256SUMS.txt)
          test "$(gh api "repos/$GITHUB_REPOSITORY/commits/$RELEASE_TAG" --jq '.sha')" = "$GITHUB_SHA"
          gh release edit "$RELEASE_TAG" --draft=false --prerelease=false --latest --title 'Release 1.0'
          test "$(gh release view "$RELEASE_TAG" --json isDraft,isPrerelease --jq '(.isDraft == false) and (.isPrerelease == false)')" = 'true'
          gh release view "$RELEASE_TAG" --json url --jq '.url' >> "$GITHUB_STEP_SUMMARY"
